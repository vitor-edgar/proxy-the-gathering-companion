<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTG Balance Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
</head>
<body>
    <div class="container">
        <header>
            <h1>PTG Balance</h1>
            <nav class="tabs">
                <button class="tab-btn active" data-target="tracker-view">Saldo</button>
                <button class="tab-btn" data-target="history-view">Histórico</button>
                <button class="tab-btn" data-target="regulations-view">Regulamento</button>
                <button class="tab-btn" data-target="deck-guide-view">Montar Deck</button>
            </nav>
        </header>

        <main>
            <!-- Tracker View -->
            <div id="tracker-view" class="view">
                <div id="balance-container">
                    <span class="label">Saldo Atual</span>
                    <div id="balance">R$ 0,00</div>
                </div>

                <!-- Main Actions -->
                <div id="tracker-main-actions" class="tracker-section">
                    <button id="btn-show-tasks" class="btn-action credit">Registrar Tarefa</button>
                    <button id="btn-show-buy" class="btn-action debit">Comprar</button>
                    <button id="btn-show-sell" class="btn-action credit">Vender</button>
                </div>

                <!-- Register Task Section -->
                <div id="section-register-task" class="tracker-section hidden">
                    <div class="section-header">
                        <button class="btn-back">← Voltar</button>
                        <h2>Registrar Tarefa</h2>
                    </div>
                    <input type="text" id="task-search-input" placeholder="Buscar tarefa..." autocomplete="off">
                    <div id="task-search-results" class="dynamic-list">
                        <!-- Tasks will be listed here dynamically -->
                    </div>
                </div>

                <!-- Buy Section -->
                <div id="section-buy" class="tracker-section hidden">
                    <div class="section-header">
                        <button class="btn-back">← Voltar</button>
                        <h2>Comprar</h2>
                    </div>
                    <div class="grid buy-grid">
                        <button class="buy-option" data-item="Carta">Carta<br><small>Valor manual</small></button>
                        <button class="buy-option" data-item="Comum" data-value="0.88">Comum<br><small>R$ 0,88</small></button>
                        <button class="buy-option" data-item="Incomum" data-value="1.48">Incomum<br><small>R$ 1,48</small></button>
                        <button class="buy-option" data-item="Rara" data-value="1.68">Rara<br><small>R$ 1,68</small></button>
                        <button class="buy-option" data-item="Mítica" data-value="5.95">Mítica<br><small>R$ 5,95</small></button>
                        <button class="buy-option" data-item="Terreno Básico" data-value="4.46">Terreno Básico<br><small>R$ 4,46</small></button>
                        <button class="buy-option" data-item="Secret Lair" data-value="50">Secret Lair<br><small>R$ 50</small></button>
                        <button class="buy-option" data-item="Precon" data-value="300">Precon<br><small>R$ 300</small></button>
                    </div>
                </div>

                <!-- Sell Section -->
                <div id="section-sell" class="tracker-section hidden">
                    <div class="section-header">
                        <button class="btn-back">← Voltar</button>
                        <h2>Vender</h2>
                    </div>
                    <div class="input-group">
                        <input type="number" id="sell-input" placeholder="Valor da venda" step="0.01">
                        <button id="btn-do-sell" class="btn-main credit">Vender</button>
                    </div>
                </div>
            </div>


            <!-- History View -->
            <div id="history-view" class="view hidden">
                <div class="history-content">
                    <h2>Histórico</h2>
                    <div id="history-list">
                        <!-- Transações serão inseridas aqui -->
                        <p class="empty-msg">Nenhuma transação registrada.</p>
                    </div>
                </div>
            </div>

            <!-- Regulations View -->
            <div id="regulations-view" class="view hidden">
                <div class="info-content" id="regulations-content">
                    <p>Carregando regulamento...</p>
                </div>
            </div>

            <!-- Deck Guide View -->
            <div id="deck-guide-view" class="view hidden">
                <div class="info-content" id="deck-guide-content">
                    <p>Carregando guia...</p>
                </div>
            </div>
        </main>


        <!-- Confirmation Modal -->
        <div id="confirm-modal" class="modal hidden">
            <div class="modal-content">
                <h3 id="confirm-modal-title">Confirmar</h3>
                <p id="confirm-modal-body"></p>
                <div class="modal-actions">
                    <button id="confirm-modal-cancel" class="btn-secondary">Cancelar</button>
                    <button id="confirm-modal-ok" class="btn-main credit">Confirmar</button>
                </div>
            </div>
        </div>

        <!-- Create Task Modal (within Tracker) -->
        <div id="create-task-modal" class="modal hidden">
            <div class="modal-content">
                <h3>Nova Tarefa</h3>
                <div class="modal-form">
                    <input type="text" id="new-task-name" placeholder="Nome da Tarefa">
                    <input type="number" id="new-task-value" placeholder="Valor da Recompensa" step="0.01">
                </div>
                <div class="modal-actions">
                    <button id="create-task-cancel" class="btn-secondary">Cancelar</button>
                    <button id="create-task-confirm" class="btn-main credit">Salvar</button>
                </div>
            </div>
        </div>

        <!-- Buy Modal -->
        <div id="buy-modal" class="modal hidden">
            <div class="modal-content">
                <h3 id="buy-modal-title">Comprar Item</h3>
                <div class="modal-form">
                    <div id="buy-price-group">
                        <label>Preço Unitário (R$)</label>
                        <input type="number" id="buy-price-input" placeholder="0,00" step="0.01">
                    </div>
                    <div>
                        <label>Quantidade</label>
                        <input type="number" id="buy-quantity-input" value="1" min="1">
                    </div>
                    <div id="buy-total-display" class="total-display">
                        Total: R$ 0,00
                    </div>
                </div>
                <div class="modal-actions">
                    <button id="buy-modal-cancel" class="btn-secondary">Cancelar</button>
                    <button id="buy-modal-confirm" class="btn-main debit">Confirmar</button>
                </div>
            </div>
        </div>

        <div id="notification" class="hidden">Saldo Negativo!</div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
